<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page d’accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="big">
    <span>Balla is <a class="underline" href="CV%20Tall%20Balla.pdf" target="_blank">open to work</a>.</span>
  </header>

  <section class="small">
    <p class="last-seen shoutout">Hello <a class="underline" href="https://www.ublo.immo/" target="_blank">Ublo</a> team. You make property managers' lives easier. I'd love to help you do it.</p>

    <footer>
      <div>
        <p class="no-margins"><a href="mailto:tallballa52@gmail.com">tallballa52@gmail.com</a></p>
        <p class="no-margins"><a href="CV%20Tall%20Balla.pdf" target="_blank">CV</a></p>
      </div>
      <div>
        Past Work
        <ul class="v-list">
          <li><a href="#caldera" data-project="caldera">Caldera</a></li>
          <li><a href="#hackly" data-project="hackly">Hackly</a></li>
          <li><a href="#rebelbase" data-project="rebelbase">Rebelbase</a></li>
        </ul>
      </div>
    </footer>
  </section>

  <dialog class="peek" id="peek">
    <div class="peek-inner">
      <div class="peek-toolbar">
        <button class="peek-btn" id="peek-expand" aria-label="Expand">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg>
        </button>
        <button class="peek-btn" id="peek-close" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <article class="peek-page">
        <h1 class="peek-title" id="peek-title"></h1>
        <p class="peek-ublo" id="peek-ublo" hidden></p>
        <div class="peek-props" id="peek-props"></div>
        <div class="peek-body" id="peek-body"></div>
      </article>
    </div>
    <nav class="peek-minimap" id="peek-minimap" aria-label="Sections"></nav>
  </dialog>

  <button class="scroll-to-top" id="to-top" aria-label="Scroll to top"><span>↑</span></button>

  <script src="script.js"></script>
</body>
</html>
